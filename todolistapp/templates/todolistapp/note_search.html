{% extends "todolistapp/base.html" %}
{% block title %}Note Search{% endblock %}
{% block content %}
<div>
    <form method="GET" action="{% url 'main:note_search' %}">
        <input type="text" name="q" class="search" placeholder="🔎 Поиск заметок" value="{{ request.GET.q|default:'' }}"><br>
        <button type="submit" style="margin-bottom: 15px" class="search-button">Найти заметку</button>
    </form>
</div>

<a style="color: white; margin-bottom: 10px" class="" href="{% url 'main:my_notes' %}">Вернуться на "Мои заметки"</a>

<div>
    {% for note in notes %}
        <div class="note-container">
            <div>
                <h2>{{ note.name }}</h2>
            </div>
            <div>
                <a href="{{ note.get_absolute_url }}"><p>{{ note.info|truncatechars:15 }}</p></a>
            </div>
            <div>
                <p>{{ note.created_at }}</p>
            </div>
            {% if note.image %}
                <div>
                    <img class="my-notes-image" src="{{ note.image.url }}" alt="">
                </div>
            {% endif %}
        </div>
    {% endfor %}   
</div>
{% endblock %}
