<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/to-do-list.png' %}">
    <title>To-do list | {% block title %}{% endblock %}</title>
</head>
<body>
    <div class="main">
        <div class="sources">
            <a href="{% url 'main_page' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'main:add_task' %}">Добавить задачу</a>
                <a href="{% url 'main:my_tasks' %}">Мои задачи</a>
                <a href="{% url 'main:add_note' %}">Добавить заметку</a>
                <a href="{% url 'main:my_notes' %}">Мои заметки</a>
                <a href="{% url 'main:tg_redirect' %}">Телеграмм бот</a>
                <a href="{% url 'users:profile' %}">Профиль</a>
                <a href="{% url 'users:logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'users:register' %}">Регистрация</a>
                <a href="{% url 'users:login' %}">Вход</a>
            {% endif %}
        </div>
        
        <div class="content">
            {% block content %}{% endblock %}<br>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
