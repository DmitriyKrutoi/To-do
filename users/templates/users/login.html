{% extends "users/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<form method="POST">
    {% csrf_token %}
    {% for field in form %}
        <div class="field-container">
            {{ field.label_tag }}
            <br>
            {{ field }}
        </div>
        <br>
    {% endfor %}
    <button class="start" type="submit">Войти</button>
</form>
{% endblock %}
