name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U test_user -d todo_db && break
            echo "Waiting... ($i)"
            sleep 2
          done
      
      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          SECRET_KEY: test-key
          DEBUG: 'True'
        run: python manage.py migrate
      
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          SECRET_KEY: test-key
          DEBUG: 'True'
        run: pytest -v